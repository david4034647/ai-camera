<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 摄像头 · 本地智能监控</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
<div class="bg-grid"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="lens"></span></div>
    <div>
      <h1>AI 摄像头</h1>
      <p class="sub">本地离线人像检测 · 3 天循环录像</p>
    </div>
  </div>

  <div class="control">
    <div class="state" id="statePill"><span class="dot"></span><span id="stateText">已停止</span></div>
    <label class="switch" title="开启 / 关闭监控">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
</header>

<main>
  <section class="stage card">
    <div class="video-wrap" id="videoWrap">
      <img id="live" alt="实时画面">
      <div class="offline" id="offline">
        <div class="offline-icon">◉</div>
        <h2>监控已关闭</h2>
        <p>开启后摄像头将持续录像，并在检测到人像时自动截图留证。</p>
        <button class="btn primary" id="startBtn">开启监控</button>
      </div>
      <div class="live-badge" id="liveBadge">LIVE</div>
    </div>

    <div class="meta-row">
      <div class="meta"><span class="k">状态</span><span class="v" id="mCamState">—</span></div>
      <div class="meta"><span class="k">分辨率</span><span class="v" id="mRes">—</span></div>
      <div class="meta"><span class="k">采集帧率</span><span class="v" id="mFps">—</span></div>
      <div class="meta"><span class="k">检测延迟</span><span class="v" id="mLat">—</span></div>
      <div class="meta"><span class="k">在线时长</span><span class="v" id="mUptime">—</span></div>
      <div class="meta"><span class="k">模型</span><span class="v" id="mModel">—</span></div>
    </div>
  </section>

  <section class="tiles">
    <div class="tile card">
      <span class="tile-label">当前人数</span>
      <div class="tile-value" id="tPersons">0</div>
      <span class="tile-hint" id="tFaces">人脸 0</span>
    </div>
    <div class="tile card">
      <span class="tile-label">今日事件</span>
      <div class="tile-value" id="tEvents">0</div>
      <span class="tile-hint" id="tActive">—</span>
    </div>
    <div class="tile card">
      <span class="tile-label">今日录像</span>
      <div class="tile-value" id="tRecSize">0 MB</div>
      <span class="tile-hint" id="tRecFile">—</span>
    </div>
    <div class="tile card">
      <span class="tile-label">磁盘剩余</span>
      <div class="tile-value" id="tDisk">—</div>
      <span class="tile-hint" id="tRetention">保留 3 天</span>
    </div>
  </section>

  <section class="card panel">
    <div class="panel-head">
      <h3>人像事件</h3>
      <div class="head-actions">
        <select id="dayFilter" class="select"><option value="">全部日期</option></select>
        <button class="btn ghost" id="refreshBtn">刷新</button>
      </div>
    </div>
    <div class="events" id="events">
      <div class="empty">暂无事件</div>
    </div>
  </section>

  <section class="card panel">
    <div class="panel-head">
      <h3>录像文件</h3>
      <span class="muted" id="recHint"></span>
    </div>
    <div class="records" id="records"><div class="empty">暂无录像</div></div>
    <div class="storage" id="storage"></div>
  </section>

  <footer class="foot">
    <span>检测频率 <b id="cDetect">—</b> fps · 事件片段 <b id="cClip">—</b> 秒 · 每天一个文件 · 数据仅存本机</span>
  </footer>
</main>

<div class="modal" id="modal">
  <div class="modal-body">
    <button class="modal-close" id="modalClose">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js?v=5"></script>
</body>
</html>
