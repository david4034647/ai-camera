[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-camera"
version = "1.0.0"
description = "Local AI monitoring camera: 7-day continuous recording with offline person detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "david4034647" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "opencv-python-headless>=4.9,<5",
  "numpy>=1.24,<3",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
